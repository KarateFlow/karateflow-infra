apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: kube-system
  labels:
    app: sonarqube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      initContainers:
        # 1. Configura il parametro del kernel vm.max_map_count richiesto da Elasticsearch incorporato in SonarQube
        - name: init-sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=524288"]
          securityContext:
            privileged: true
        # 2. Corregge i permessi delle cartelle montate sul volume in modo che l'utente non-root (UID 1000) possa scrivere
          # (L'allocatore local-path crea i volumi montati di default come root:root)
        - name: directory-permissions
          image: busybox:1.36
          command: ["chown", "-R", "1000:1000", "/opt/sonarqube/data", "/opt/sonarqube/extensions", "/opt/sonarqube/logs"]
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
              subPath: data
            - name: sonarqube-data
              mountPath: /opt/sonarqube/extensions
              subPath: extensions
            - name: sonarqube-data
              mountPath: /opt/sonarqube/logs
              subPath: logs
          securityContext:
            runAsUser: 0
        # 3. Attende che PostgreSQL sia pronto prima di far partire SonarQube
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-sonar-service -p 5432 -U sonar; do
                echo "In attesa che PostgreSQL sia raggiungibile..."
                sleep 2
              done
      containers:
        - name: sonarqube
          image: sonarqube:lts-community
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: SONAR_JDBC_USERNAME
              value: sonar
            - name: SONAR_JDBC_PASSWORD
              value: sonarpassword
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://postgres-sonar-service:5432/sonar
            # Limitiamo la memoria delle tre JVM interne di SonarQube (Web, Compute Engine, Search/ES)
            # Nota: -Xms deve essere uguale a -Xmx per superare i bootstrap check di Elasticsearch
            - name: SONAR_WEB_JAVAADDITIONALOPTS
              value: "-Xms512m -Xmx512m -XX:+UseG1GC"
            - name: SONAR_CE_JAVAADDITIONALOPTS
              value: "-Xms512m -Xmx512m -XX:+UseG1GC"
            - name: SONAR_SEARCH_JAVAADDITIONALOPTS
              value: "-Xms512m -Xmx512m -XX:+UseG1GC"
          resources:
            requests:
              memory: "1536Mi"
              cpu: "300m"
            limits:
              memory: "2252Mi"
              cpu: "1.5"
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
              subPath: data
            - name: sonarqube-data
              mountPath: /opt/sonarqube/extensions
              subPath: extensions
            - name: sonarqube-data
              mountPath: /opt/sonarqube/logs
              subPath: logs
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 150
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 15
      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: sonarqube-pvc
