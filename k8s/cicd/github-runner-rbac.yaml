apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-sa
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-role
  namespace: cicd
rules:
  # Questi permessi permettono al runner di eseguire deploy (kubectl apply) 
  # nello stesso namespace. Regolali a seconda delle esigenze di sicurezza.
  - apiGroups: ["", "apps", "batch"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-rolebinding
  namespace: cicd
subjects:
  - kind: ServiceAccount
    name: github-runner-sa
    namespace: cicd
roleRef:
  kind: Role
  name: github-runner-role
  apiGroup: rbac.authorization.k8s.io
